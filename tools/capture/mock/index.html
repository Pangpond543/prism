<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Prism overlay mock</title>
<!-- Faithful re-drawings of the native overlays (Prism Rec floating bar, Prism VoiceOpen glow + caption) on a demo desktop.
     The real ones refract the user's own screen, so they are never captured for the public site. ?m=bar|rec|draw|listen|ok -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #232a47; --ink2: #4a5376; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "IBM Plex Sans Thai", "Segoe UI", sans-serif; }
  body { background: radial-gradient(70% 60% at 20% 15%, #3a4fd8, transparent 70%), radial-gradient(60% 60% at 85% 30%, #b04fd0, transparent 70%), radial-gradient(70% 70% at 50% 100%, #ff8a6b, transparent 70%), #1b1f4a; }
  [data-theme="dark"] body { filter: brightness(.82); }
  /* demo app window on the desktop */
  .win { position: absolute; left: 7%; top: 14%; width: 62%; height: 64%; border-radius: 14px; overflow: hidden; background: #0f1330; box-shadow: 0 40px 80px -20px rgba(0,0,0,.6); }
  .win .tb { height: 34px; background: #1b2150; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #c8cff5; font: 600 13px "Segoe UI"; }
  .win .tb i { width: 10px; height: 10px; border-radius: 50%; background: #ff6b8b; } .win .tb i:nth-child(2) { background: #ffc46b; } .win .tb i:nth-child(3) { background: #4fd39c; }
  .win .game { position: absolute; inset: 34px 0 0; background: linear-gradient(180deg, #5ac8ff 0%, #9be7ff 55%, #59c27a 55%, #2f8f50 100%); }
  .win .sun { position: absolute; right: 12%; top: 12%; width: 90px; height: 90px; border-radius: 50%; background: #fff3a8; box-shadow: 0 0 60px #fff3a8; }
  .win .hill { position: absolute; bottom: 0; width: 60%; height: 55%; border-radius: 50% 50% 0 0; background: #3fa863; }
  .win .hill.b { left: 45%; width: 70%; height: 45%; background: #2e8a4f; }
  .win .hud { position: absolute; left: 18px; top: 16px; color: #fff; font: 800 22px "Segoe UI"; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .side-win { position: absolute; right: 5%; top: 22%; width: 22%; height: 40%; border-radius: 14px; background: rgba(255,255,255,.9); box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); padding: 16px; }
  .side-win b { display: block; font-size: 14px; color: #232a47; margin-bottom: 10px; }
  .side-win i { display: block; height: 9px; border-radius: 5px; background: #dfe4f5; margin: 8px 0; } .side-win i:nth-child(3) { width: 70%; } .side-win i:nth-child(5) { width: 55%; }

  /* ---------------- Prism Rec floating bar */
  .bar { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .row { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(255,255,255,.62), rgba(255,255,255,.28) 50%, rgba(255,255,255,.44));
    backdrop-filter: blur(22px) saturate(180%); box-shadow: 0 20px 44px -16px rgba(20,20,70,.6), inset 0 1px 0 #fff, inset 0 -1px 0 rgba(255,255,255,.4); }
  .logo { width: 34px; height: 34px; position: relative; margin: 0 4px 0 2px; cursor: grab; }
  .logo i { position: absolute; inset: 0; border-radius: 30%; border: 1.4px solid #fff; background: linear-gradient(135deg, #f04a57, #ffc174); }
  .logo i:nth-child(2) { inset: 4px; transform: rotate(30deg); background: linear-gradient(135deg, #ffa3a3, #f04a57); }
  .logo i:nth-child(3) { inset: 8px; transform: rotate(60deg); background: linear-gradient(135deg, #ffc174, #fff); }
  .pill { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px 0 14px; border-radius: 999px; font-weight: 700; font-size: 15px; color: #fff; background: linear-gradient(120deg, #ff5f6d, #ff8fa8); box-shadow: 0 10px 22px -8px rgba(240,74,87,.9), inset 0 1px 0 rgba(255,255,255,.6); }
  .pill .dotr { width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .pill.on { background: linear-gradient(120deg, #f04a57, #c2185b); }
  .pill.on .sq { width: 12px; height: 12px; border-radius: 3px; background: #fff; }
  .b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); position: relative; }
  .b svg { width: 19px; height: 19px; }
  .b.on { background: rgba(255,255,255,.75); box-shadow: inset 0 1px 0 #fff; color: #6a4dff; }
  .b.mic.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(63,207,164,.9), 0 0 10px rgba(63,207,164,.8); }
  .rp { display: flex; align-items: center; gap: 6px; white-space: nowrap; height: 34px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,.55); }
  .rp em { width: 8px; height: 8px; border-radius: 50%; background: #3fcfa4; box-shadow: 0 0 8px #3fcfa4; }
  .sep { width: 1px; height: 22px; background: rgba(35,42,71,.18); margin: 0 4px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .sw.sel { outline: 2px solid #6a4dff; outline-offset: 2px; }
  .tip { position: absolute; bottom: 100%; margin-bottom: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 6px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,.92); box-shadow: 0 10px 24px -8px rgba(0,0,0,.4); }
  .note { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,.85); }
  /* highlight + drawing overlays */
  .hl { position: absolute; left: 38%; top: 46%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(138,125,255,.35); box-shadow: 0 0 0 3px rgba(138,125,255,.9), 0 0 24px rgba(138,125,255,.7); }
  .hl::after { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 2px solid rgba(138,125,255,.6); }
  svg.ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .frame { position: absolute; left: 7%; top: 14%; width: 62%; height: 64%; border-radius: 16px; outline: 3px dashed rgba(255,143,199,.95); outline-offset: 5px; }
  .timer { font-variant-numeric: tabular-nums; }

  /* ---------------- Prism VoiceOpen glow + caption */
  .glow { position: absolute; inset: 0; pointer-events: none; }
  .glow i { position: absolute; filter: blur(10px); }
  .glow .t, .glow .bt { left: 0; right: 0; height: var(--g, 16px); background: linear-gradient(90deg, #8ea2ff, #c79bff, #ff9ec7, #ffc79a, #7fe3d0, #8ea2ff); }
  .glow .t { top: calc(var(--g, 16px) * -.4); } .glow .bt { bottom: calc(var(--g, 16px) * -.4); }
  .glow .l, .glow .r { top: 0; bottom: 0; width: var(--g, 16px); background: linear-gradient(180deg, #ff9ec7, #c79bff, #8ea2ff, #7fe3d0, #ffc79a); }
  .glow .l { left: calc(var(--g, 16px) * -.4); } .glow .r { right: calc(var(--g, 16px) * -.4); }
  .glow.ok i { background: linear-gradient(90deg, #3fcfa4, #7fe3d0, #b8f5df, #3fcfa4) !important; }
  .cap { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); min-width: 360px; display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-radius: 22px;
    background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.4)); backdrop-filter: blur(22px) saturate(170%); box-shadow: 0 24px 50px -16px rgba(20,20,70,.6), inset 0 1px 0 #fff; color: var(--ink); }
  .cap .orb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #f2922a, #ff8fa8); box-shadow: 0 8px 18px -6px rgba(242,146,42,.9); }
  .cap.ok .orb { background: linear-gradient(135deg, #3fcfa4, #7fe3d0); }
  .cap .orb svg { width: 22px; height: 22px; }
  .cap b { display: block; font-size: 17px; } .cap span { display: block; font-size: 13px; color: var(--ink2); }
  .lv { display: flex; align-items: center; gap: 3px; height: 28px; margin-left: auto; }
  .lv i { width: 4px; border-radius: 2px; background: linear-gradient(#ff9ec7, #8ea2ff); }
</style>
</head>
<body>
<div class="win"><div class="tb"><i></i><i></i><i></i>&nbsp; Pixel Farm</div><div class="game"><div class="sun"></div><div class="hill"></div><div class="hill b"></div><div class="hud">★ 1,240</div></div></div>
<div class="side-win"><b>Notes</b><i></i><i></i><i></i><i></i><i></i></div>
<div id="stage"></div>
<script>
const m = new URLSearchParams(location.search).get('m') || 'bar';
const th = (localStorage.getItem('prism.lang') || 'th') !== 'en';
document.documentElement.dataset.theme = localStorage.getItem('prism.theme') || 'light';
const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic = {
  replay: S('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l3 2"/>'),
  pause: S('<rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/>'),
  full: S('<rect x="3" y="5" width="18" height="14" rx="2.5"/>'),
  area: S('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>'),
  mic: S('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  sound: S('<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>'),
  hl: S('<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/>'),
  pen: S('<path d="M4 20l4-1 10-10-3-3L5 16l-1 4Z"/><path d="M13 7l3 3"/>'),
  win: S('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/>'),
  hi: S('<path d="M9 14l-3 3v3h3l3-3"/><path d="M9 14l7-7 3 3-7 7"/>'),
  arrow: S('<path d="M5 19 19 5M10 5h9v9"/>'),
  box: S('<rect x="4" y="6" width="16" height="12" rx="2"/>'),
  undo: S('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
  trash: S('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  fade: S('<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/>'),
  check: S('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
};
const st = document.getElementById('stage');
if (['bar', 'rec', 'draw'].includes(m)) {
  const rec = m !== 'bar';
  const row = `<div class="row" id="row">
    <div class="logo" id="b-logo"><i></i><i></i><i></i></div>
    <div class="pill${rec ? ' on' : ''}" id="b-rec">${rec ? '<span class="sq"></span><span class="timer">00:42</span>' : `<span class="dotr"></span>${th ? 'อัด' : 'Rec'}`}</div>
    <div class="rp" id="b-replay"><em></em>${ic.replay}${th ? '30 วิ' : '30 s'}</div>
    ${rec ? `<div class="b" id="b-pause">${ic.pause}</div>` : ''}
    <div class="sep"></div>
    ${rec ? '' : `<div class="b" id="b-area">${ic.full}</div>`}
    <div class="b mic on" id="b-mic">${ic.mic}</div>
    <div class="b on" id="b-sound">${ic.sound}</div>
    <div class="b${rec ? ' on' : ''}" id="b-hl">${ic.hl}</div>
    <div class="b${m === 'draw' ? ' on' : ''}" id="b-draw">${ic.pen}</div>
    <div class="sep"></div>
    <div class="b" id="b-main">${ic.win}</div>
    ${m === 'bar' ? `<div class="tip" style="left:22%">${th ? 'เริ่มอัด  (Ctrl+Alt+R)' : 'Start recording  (Ctrl+Alt+R)'}</div>` : ''}
  </div>`;
  const tools = m === 'draw' ? `<div class="row" id="tools">
    <div class="b on" id="t-pen">${ic.pen}</div><div class="b" id="t-hi">${ic.hi}</div><div class="b" id="t-arrow">${ic.arrow}</div><div class="b" id="t-box">${ic.box}</div>
    <div class="sep"></div><span id="t-colors" style="display:flex;gap:6px;padding:0 4px">${['#ff4f6d', '#ffa53a', '#3fcf6e', '#3d8bff', '#9b6bff', '#ffffff'].map((c, i) => `<span class="sw${i === 0 ? ' sel' : ''}" style="background:${c}"></span>`).join('')}</span>
    <div class="sep"></div><div class="b" id="t-undo">${ic.undo}</div><div class="b" id="t-clear">${ic.trash}</div><div class="b" id="t-fade">${ic.fade}</div>
    <div class="pill" id="t-done" style="height:34px;background:linear-gradient(120deg,#8ea2ff,#c79bff)">${ic.check}${th ? 'เสร็จ' : 'Done'}</div></div>` : '';
  st.innerHTML = `${rec ? '<div class="frame" id="o-frame"></div>' : ''}
    ${m === 'rec' ? '<div class="hl" id="o-hl"></div>' : ''}
    ${m === 'draw' ? `<svg class="ink" id="o-ink" viewBox="0 0 1480 920" preserveAspectRatio="none"><path d="M330 300 C 380 250, 470 250, 520 300 S 620 360, 660 300" fill="none" stroke="#ff4f6d" stroke-width="6" stroke-linecap="round"/><path d="M760 420 L 900 330" stroke="#ff4f6d" stroke-width="6" stroke-linecap="round"/><path d="M880 330 L 900 330 L 892 350" fill="none" stroke="#ff4f6d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="230" y="470" width="260" height="110" rx="10" fill="none" stroke="#ff4f6d" stroke-width="6"/></svg>` : ''}
    <div class="bar" id="bar">${tools}${row}${m === 'rec' ? `<div class="note" id="o-note">${th ? '● กำลังอัด · Ctrl+Alt+P พักไว้ก่อน' : '● Recording · Ctrl+Alt+P to pause'}</div>` : ''}</div>`;
} else {
  const ok = m === 'ok';
  st.innerHTML = `<div class="glow${ok ? ' ok' : ''}" id="o-glow" style="--g:${ok ? 14 : 22}px"><i class="t"></i><i class="bt"></i><i class="l"></i><i class="r"></i></div>
    <div class="cap${ok ? ' ok' : ''}" id="o-cap"><div class="orb">${ok ? ic.check : ic.mic}</div>
      <div><b>${ok ? (th ? 'เปิด YouTube' : 'Open YouTube') : (th ? 'กำลังฟัง…' : 'Listening…')}</b><span>${ok ? (th ? 'ได้ยินว่า “เปิดยูทูปหน่อย”' : 'Heard “open YouTube please”') : (th ? 'ปล่อยปุ่มเมื่อพูดจบ · Esc ยกเลิก' : 'Release the key when done · Esc to cancel')}</span></div>
      ${ok ? '' : `<div class="lv" id="o-lv">${[10, 18, 26, 14, 22, 28, 12, 20, 16, 8].map((h) => `<i style="height:${h}px"></i>`).join('')}</div>`}</div>`;
}
</script>
</body>
</html>
