<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism — ชุดโปรแกรม Windows ที่สวย เบา และสอนตัวเองได้</title>
<meta name="description" content="Prism by 543 — 6 โปรแกรม Windows ฟรี สร้างด้วย Claude AI หน้าตาแก้ว ทำงานออฟไลน์ พร้อมคู่มือแบบชี้แล้วรู้: Prism Size, Cam, Player/Studio, Rec, VoiceOpen, Code">
<link rel="icon" href="img/logos/cam.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('prism.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
</head>
<body data-page="home">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="page">
  <header id="nav"></header>
  <main id="main">
    <section class="hero"><div class="wrap hero-grid">
      <div>
        <div class="eyebrow rv" data-t="ชุดโปรแกรม Windows · สร้างด้วย Claude AI · by 543|A Windows app suite · made with Claude AI · by 543"></div>
        <h1 class="rv" style="--i:1"><span data-t="สวย เบา|Beautiful, light"></span><br><span class="grad-text" data-t="และสอนตัวเองได้|and self-teaching"></span></h1>
        <p class="lead rv" style="--i:2" data-t="Prism คือโปรแกรม 6 ตัวที่ผมสร้างโดยใช้ Claude AI หน้าตาเป็นแก้วใสเหมือนกันทุกตัว ทำงานออฟไลน์ ไม่ต้องสมัครบัญชี และทุกตัวมีคู่มือแบบ “ชี้ตรงไหนก็รู้ว่าทำอะไร” บนหน้าจอจริงของโปรแกรม|Prism is six Windows apps I made using Claude AI. They share one clear-glass look, work offline with no account — and each comes with a “point anywhere and learn” guide built on the app’s real screens."></p>
        <div class="hero-cta rv" style="--i:3">
          <a class="btn primary big" href="#apps"><span data-t="เลือกโปรแกรม|Choose an app"></span></a>
          <button class="btn big" type="button" id="hero-search"><span data-t="ค้นว่าทำอะไรได้|Search what it can do"></span> <span class="kbd">Ctrl K</span></button>
        </div>
        <div class="hero-facts rv" style="--i:4">
          <div><b>6</b><span data-t="โปรแกรม|apps"></span></div>
          <div><b>100%</b><span data-t="ออฟไลน์|offline"></span></div>
          <div><b>0 ฿</b><span data-t="ฟรีทุกตัว|free"></span></div>
          <div><b>TH · EN</b><span data-t="สองภาษา|two languages"></span></div>
        </div>
      </div>
      <div class="orbit" id="orbit" aria-hidden="true"><div class="orbit-sun"><span class="mark"><i></i><i></i><i></i></span></div></div>
    </div></section>

    <section id="apps"><div class="wrap">
      <div class="center"><div class="eyebrow rv" data-t="ทั้งหมด 6 โปรแกรม|All six apps"></div>
      <h2 class="title rv" data-t="เลือกสิ่งที่อยากทำ|Pick what you want to do"></h2>
      <p class="lead rv" data-t="ทุกตัวมีหน้าคู่มือของตัวเอง: ดาวน์โหลด ชี้หน้าจอเพื่อเรียน ดูเมาส์สาธิต คีย์ลัด และคำถามที่พบบ่อย|Each app has its own page: download, point-and-learn on the real screens, demo cursor, shortcuts and FAQ."></p></div>
      <div class="apps" id="app-grid"></div>
    </div></section>

    <section id="learn"><div class="wrap">
      <div class="teaser">
        <div>
          <div class="eyebrow rv" data-t="วิธีเรียนรู้แบบ Prism|How Prism teaches"></div>
          <h2 class="title rv" data-t="ไม่ต้องอ่านคู่มือยาว ๆ|No long manuals"></h2>
          <p class="lead rv" data-t="ลองเลย — ภาพทางขวาคือหน้าจอจริงของ Prism Cam เอาเมาส์ไปชี้ปุ่มไหนก็ได้|Try it — the picture on the right is the real Prism Cam. Point at any button."></p>
          <ol class="steps-list">
            <li class="rv"><span class="n">1</span><div><b data-t="ชี้แล้วรู้|Point and know"></b><span data-t="ชี้ตรงไหน กรอบเรืองแสงพร้อมคำอธิบาย เคล็ดลับ และคีย์ลัดจะโผล่ขึ้นมา|Point anywhere: a glowing frame shows what it does, with tips and shortcuts."></span></div></li>
            <li class="rv"><span class="n">2</span><div><b data-t="ดูเมาส์สาธิต|Watch the demo cursor"></b><span data-t="เลือก “อยากทำอะไร” แล้วเมาส์สาธิตจะกดให้ดูทีละขั้นบนหน้าจอจริง|Pick a task and a demo cursor clicks through it on the real screens."></span></div></li>
            <li class="rv"><span class="n">3</span><div><b data-t="ค้นได้ทุกอย่าง|Search everything"></b><span data-t="กด Ctrl+K พิมพ์ “อัดเสียงคอม” — พาไปชี้ปุ่มนั้นในแอปที่ถูกต้องทันที|Press Ctrl+K and type “record PC sound” — it takes you straight to that button in the right app."></span></div></li>
          </ol>
        </div>
        <div class="explorer-mini rv" id="mini"></div>
      </div>
    </div></section>

    <section id="install"><div class="wrap">
      <div class="center"><div class="eyebrow rv" data-t="ติดตั้ง|Install"></div>
      <h2 class="title rv" data-t="โหลดแล้วใช้ได้ใน 1 นาที|Running in a minute"></h2></div>
      <div class="install">
        <div class="glass lit rv"><div class="num">01</div><h3 data-t="กดดาวน์โหลด|Download"></h3><p data-t="ในหน้าของแต่ละโปรแกรม กด “ตัวติดตั้ง” (Setup) หรือ “แบบพกพา” (ไม่ต้องติดตั้ง แตกไฟล์แล้วเปิดได้เลย) ไฟล์มาจาก GitHub ของผมโดยตรง และเป็นเวอร์ชันล่าสุดเสมอ|On an app page click “Installer” (Setup) or “Portable” (no install, unzip and run). Files come straight from my GitHub and are always the newest version."></p></div>
        <div class="glass lit rv" style="--i:1"><div class="num">02</div><h3 data-t="ถ้า Windows ขึ้นจอฟ้า|If Windows shows a blue screen"></h3><p data-t="โปรแกรมยังไม่มีลายเซ็นดิจิทัลแบบเสียเงิน Windows เลยเตือนไว้ก่อน กด More info แล้ว Run anyway|The apps aren’t code-signed yet, so Windows warns first. Click More info, then Run anyway."></p>
          <div class="smartscreen" aria-hidden="true"><div class="ss-body"><b>Windows protected your PC</b>Microsoft Defender SmartScreen prevented an unrecognized app from starting.<br><span class="hl"><u>More info</u></span></div><div class="ss-foot"><span class="hl">Run anyway</span><span>Don't run</span></div></div></div>
        <div class="glass lit rv" style="--i:2"><div class="num">03</div><h3 data-t="อัปเดตเองได้|Updates itself"></h3><p data-t="กดปุ่ม ⓘ มุมขวาบนของโปรแกรม ถ้ามีเวอร์ชันใหม่จะมีจุดชมพูเตือน และอัปเดตได้ในคลิกเดียว|Click ⓘ at the top right of the app: a pink dot tells you when there’s a new version, and one click updates it."></p></div>
      </div>
    </div></section>
  </main>
  <footer id="foot"></footer>
</div>

<script defer src="js/bg.js"></script>

<script defer src="js/guide.js"></script>
<script defer src="js/home.js"></script>
<script defer src="js/footer.js"></script>
</body>
</html>
